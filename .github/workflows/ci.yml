name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Stable Rust を準備する
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: フォーマットを検証する
        run: cargo fmt --check

      - name: Lint を検証する
        run: cargo clippy --locked -- -D warnings

      - name: テストを実行する
        run: cargo test --locked

      - name: ビルド補助とリリース条件を検証する
        run: python -m unittest discover -s tests

      - name: プラグインをビルドする
        run: cargo build --release --locked

      - name: ビルド済みプラグインの登録情報を検証する
        run: python scripts/verify_pipl.py target/release/rgba_contrast.dll

  macos-install:
    name: macOSのビルドと一時配置を検証する
    runs-on: macos-latest
    env:
      PluginName: rgba_contrast
      CARGO_TARGET_DIR: target/CI build output
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: ビルド用ツールを準備する
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install just --version 1.42.4 --locked

      - name: 配置補助の契約を検証する
        run: |
          just --list
          python3 -X utf8 -m unittest discover -s tests -v

      - name: 実バンドルを検査して一時フォルダーへ配置する
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/owner's plugins \$example"
          python3 scripts/install_plugin.py --dry-run "$destination"
          test ! -e "$destination"
          python3 scripts/install_plugin.py "$destination"
          python3 scripts/install_plugin.py "$destination"
          python3 -c 'import hashlib, pathlib, sys; digest = lambda p: {str(f.relative_to(p)): hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob("*") if f.is_file()}; assert digest(pathlib.Path(sys.argv[1])) == digest(pathlib.Path(sys.argv[2]))' "$CARGO_TARGET_DIR/release/rgba_contrast.plugin" "$destination/rgba_contrast.plugin"
