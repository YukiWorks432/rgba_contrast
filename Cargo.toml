[package]
name = "rgba_contrast"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
after-effects = { git = "https://github.com/virtualritz/after-effects.git", rev = "83dcc93734fd5db1335b6ec83cba7a6505a39dcc" }
palette = { version = "0.7.7", default-features = false, features = ["std"] }

[build-dependencies]
pipl = { git = "https://github.com/virtualritz/after-effects.git", rev = "83dcc93734fd5db1335b6ec83cba7a6505a39dcc" }

[lints.rust]
# Teach rustc about cfg names/values used by the macro to avoid `unexpected_cfgs` warnings
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(does_dialog)',
    'cfg(threaded_rendering)',
    'cfg(smart_render)',
    'cfg(feature, values("catch-panics"))',
] }
