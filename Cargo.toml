[package]
name = "rgba_contrast"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
after-effects = "0.2.1"
palette = { version = "0.7.7", default-features = false, features = ["std"] }

[build-dependencies]
pipl = "0.1.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[lints.rust]
# Teach rustc about cfg names/values used by the macro to avoid `unexpected_cfgs` warnings
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(does_dialog)',
    'cfg(threaded_rendering)',
    'cfg(smart_render)',
    'cfg(feature, values("catch-panics"))',
] }
